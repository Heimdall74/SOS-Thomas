# Configuration pour Render
services:
  - type: web
    name: sos-thomas-python
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn app:app
    healthCheckPath: /
    httpPort: 5000
    autoDeploy: yes
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sos-thomas-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: sos-thomas-db
    databaseName: sos_thomas
    user: sos_thomas_user
    plan: free
